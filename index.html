<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlobalAz – Dünya bir toxunuşla yaxındadır</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F6F4;--sf:#fff;--ink:#1C1B1A;--mu:#6B6862;--ln:#E6E3DE;--or:#F2620F;--grn:#0E9F5B;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--sf:#1F1D1A;--ink:#F3F1EE;--mu:#A19D96;--ln:#34312D;--or:#FF7A33;--grn:#2BC77F;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--sf:#1F1D1A;--ink:#F3F1EE;--mu:#A19D96;--ln:#34312D;--or:#FF7A33;--grn:#2BC77F;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Manrope,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#010101;z-index:30}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#010101;display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{height:30px;width:auto;display:block}.banner{background:#010101;color:#fff;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px}.banner img{height:64px;width:auto}.banner b{font:800 17px Unbounded,sans-serif;display:block}.banner span{color:#FFB070;font-size:14px}@media (max-width:560px){header{flex-wrap:wrap}.logo{margin-right:auto;height:24px}#q{order:5;flex-basis:100%}}
#q{flex:1;min-width:0;border:0;border-radius:99px;padding:10px 16px;background:#fff;color:#1C1B1A}
.hb{background:#fff;color:#1C1B1A;border:0;border-radius:99px;padding:9px 14px;font-weight:800;white-space:nowrap}
.cnt{background:var(--or);color:#fff;border-radius:99px;padding:0 7px;margin-left:5px;font-size:13px}
.strip{background:var(--sf);border-bottom:1px solid var(--ln);display:flex;gap:18px;justify-content:center;padding:8px 14px;font-size:13px;font-weight:600;flex-wrap:wrap}
.strip span::before{content:"✓ ";color:var(--grn)}
main{max-width:1100px;margin:0 auto;padding:12px 12px 40px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;padding:4px 0 14px}
.chip{display:grid;justify-items:center;gap:2px;border:1px solid var(--ln);background:var(--sf);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:600;line-height:1.2}.chip span{font-size:26px}
.chip[aria-pressed="true"]{background:var(--or);color:#fff;border-color:var(--or)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:10px}
.card{background:var(--sf);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--ln)}
.pic{font-size:60px;text-align:center;padding:24px 0;background:var(--bg)}
.cb{padding:10px;display:grid;gap:4px;flex:1;align-content:start}
.cb h3{margin:0;font-size:14px;font-weight:600;line-height:1.3}
.price{font:800 20px Unbounded,sans-serif;color:var(--or)}
.sub{font-size:12px;color:var(--grn);font-weight:600}
.add{margin-top:4px;background:var(--or);color:#fff;border:0;border-radius:99px;padding:9px;font-weight:800}
.empty{grid-column:1/-1;color:var(--mu);padding:24px 0}
select,textarea{font:inherit;color:inherit}.card{position:relative}.ft{color:var(--mu);font-size:13px;margin-top:28px}
.fv{position:absolute;top:6px;right:6px;z-index:1;background:rgba(255,255,255,.92);color:#E11D48;border:0;border-radius:99px;width:32px;height:32px;font-size:18px}
dialog{border:0;border-radius:16px;padding:0;width:min(500px,calc(100% - 24px));background:var(--sf);color:var(--ink);max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--sf)}
.dh h2{margin:0;font:600 17px Unbounded,sans-serif}
.db{padding:14px 16px;display:grid;gap:12px}
.gh{background:transparent;border:1px solid var(--ln);border-radius:10px;padding:7px 12px;font-weight:600}
label{display:grid;gap:4px;font-size:13px;color:var(--mu);font-weight:600}
input:not(#q),select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px;width:100%}
.it{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding-bottom:10px;border-bottom:1px solid var(--ln)}
.qty{display:flex;align-items:center;gap:8px;grid-column:1/-1}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--ln);background:var(--bg)}
.tl{display:flex;justify-content:space-between;color:var(--mu)}
.tl.t{color:var(--ink);font:800 22px Unbounded,sans-serif;align-items:baseline}
.note{font-size:13px;color:var(--mu);margin:0}
.warn{background:#FFE08A;color:#1C1B1A;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
[hidden]{display:none!important}
</style>
<style>
main{max-width:1280px}
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.cats{display:flex;flex-direction:column;gap:2px;padding:8px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));max-height:calc(100vh - 84px);overflow:auto}
.chip{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;font-size:14px;font-weight:600}
.chip:hover{background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--or);color:#fff}
.chip .ci{font-size:18px;width:24px;text-align:center}.chip .cn{flex:1;font-size:14px;line-height:1.25}.chip .ct{font-size:12px;opacity:.65;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mu);font-weight:600;font-size:14px}.bar select{width:auto}
.grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:14px}
.card{border-radius:12px;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.14);transform:translateY(-2px)}
.im{background:#f0f0f0;aspect-ratio:1;cursor:pointer;overflow:hidden}.im img{width:100%;height:100%!important;aspect-ratio:auto!important;object-fit:cover;display:block;transition:transform .25s}.card:hover .im img{transform:scale(1.04)}
.im .pic{height:100%;padding:0;display:grid;place-items:center;background:transparent}
.cb{padding:12px;gap:6px}
.cb h3{cursor:pointer;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font:800 19px Unbounded,sans-serif}
.add.ic{width:38px;height:38px;padding:0;margin:0;border-radius:50%;font-size:17px;flex:none;display:grid;place-items:center}
@media (max-width:860px){.shop{grid-template-columns:1fr}.cats{flex-direction:row;overflow-x:auto;position:static;max-height:none;padding:6px}.chip{width:auto;white-space:nowrap;flex:none;border:1px solid var(--ln)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.price{font-size:16px}}
</style>
</head>
